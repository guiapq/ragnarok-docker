services:

  db:
    image: mariadb:10.5
    container_name: ragnarok-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql-init:/docker-entrypoint-initdb.d
    ports:
      - "${BIND_IP:-127.0.0.1}:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ragnarok-phpmyadmin
    restart: always
    ports:
      - "${BIND_IP:-127.0.0.1}:8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  rathena:
    build:
      context: .
      dockerfile: docker/rathena/Dockerfile
      args:
        RATHENA_REPO: https://github.com/guiapq/rathena.git
        RATHENA_COMMIT: ac46920e73819662811573253d9b22592e8ad985
        RO_PACKETVER: ${RO_PACKETVER:-20151104}
    container_name: ragnarok-server
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:6900:6900"
      - "${BIND_IP:-127.0.0.1}:6121:6121"
      - "${BIND_IP:-127.0.0.1}:5121:5121"
    volumes:
      - ./data/db:/opt/rathena/db
      - ./data/npc:/opt/rathena/npc
      - ./data/conf:/opt/rathena/conf

  robrowser:
    build:
      context: ./docker/robrowser
      args:
        ROBROWSER_COMMIT: ${ROBROWSER_COMMIT:-fd9183f}
    container_name: robrowser
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BIND_IP:-127.0.0.1}:8001:8080"
      - "${BIND_IP:-127.0.0.1}:5999:5999"
    depends_on:
      - rathena
    volumes:
      - ./data:/opt/roBrowserLegacy/data

  panel:
    build:
      context: .
      dockerfile: docker/panel/Dockerfile
    container_name: ragnarok-panel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-ragnarok}
      DB_USERNAME: ${MYSQL_USER:-ragnarok}
      DB_PASSWORD: ${MYSQL_PASSWORD:-ragnarok}
    ports:
      - "${BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - ./web:/var/www/html
      - ./data:/var/www/html/game-data:ro
    depends_on:
      db:
        condition: service_healthy

  registry:
    image: registry:2
    container_name: ragnarok-registry
    restart: always
    ports:
      - "${BIND_IP:-127.0.0.1}:5000:5000"
    volumes:
      - registry_data:/var/lib/registry

volumes:
  db_data:
  registry_data:
