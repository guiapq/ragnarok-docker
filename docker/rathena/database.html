<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Ragnarok Procedural Database</title>

<style>
body{
font-family:Arial;
background:linear-gradient(160deg,#0f2027,#203a43,#2c5364);
color:#e0f7f7;
margin:40px;
}

h1{ color:#7fe3ea; }

.searchbox{
position:relative;
display:inline-block;
margin-bottom:10px;
}

input{
padding:10px;
font-size:16px;
width:260px;
background:#0e2a30;
border:1px solid #2f7a83;
color:#d6ffff;
}

.autocomplete{
background:#132e35;
border:1px solid #2f7a83;
position:absolute;
top:100%;
left:0;
max-height:220px;
overflow-y:auto;
z-index:9999;
width:100%;
}

.autoitem{ padding:8px; cursor:pointer; }
.autoitem:hover{ background:#1d4750; }

.section{
margin-top:25px;
padding:15px;
background:#132e35;
border-left:4px solid #2f7a83;
border-radius:6px;
}

.title{
font-size:22px;
margin-bottom:10px;
color:#7fe3ea;
}

.mob{ cursor:pointer; padding:6px; color:#7fe3ea; }
.mob:hover{ background:#1d4750; }

.stats{ margin-top:10px; line-height:1.6; }

.sprite{
width:48px;
height:48px;
margin-bottom:10px;
image-rendering:pixelated;
border-radius:6px;
}

.tag{
display:inline-block;
padding:3px 8px;
border-radius:4px;
background:#1d4750;
margin-left:8px;
font-size:12px;
}

.link{
display:inline-block;
margin-top:10px;
padding:6px 10px;
background:#1d4750;
border-radius:6px;
text-decoration:none;
color:#a8fff4;
font-size:13px;
}

.link:hover{
background:#2f7a83;
}
</style>

</head>

<body>

<h1>Ragnarok Database</h1>

<div class="searchbox">
<input id="itemSearch" placeholder="Search item (name or ID)">
<div id="itemAuto" class="autocomplete"></div>
</div>

<br>

<div class="searchbox">
<input id="mobSearch" placeholder="Search monster (name or ID)">
<div id="mobAuto" class="autocomplete"></div>
</div>

<div id="result"></div>

<script>
let items={}, itemInfo={}, itemToMobs={}, mobToItems={}, mobStats={}, mobSpawn={};
let dbLoaded = false;

function debounce(fn, delay){
let t;
return (...args)=>{
clearTimeout(t);
t = setTimeout(()=>fn(...args), delay);
};
}

async function loadDB(){
items = await fetch('db/items.json').then(r=>r.json());
itemInfo = await fetch('db/item_info.json').then(r=>r.json());
itemToMobs = await fetch('db/item_to_mobs.json').then(r=>r.json());
mobToItems = await fetch('db/mob_to_items.json').then(r=>r.json());
mobStats = await fetch('db/mob_stats.json').then(r=>r.json());
mobSpawn = await fetch('db/mob_spawn.json').then(r=>r.json());

dbLoaded = true;

setupSearch("itemSearch","itemAuto",items,showItem,false);
setupSearch("mobSearch","mobAuto",mobStats,showMob,true);
}

loadDB();

function divineItem(id){
return `https://www.divine-pride.net/database/item/${id}`;
}

function divineMob(id){
return `https://www.divine-pride.net/database/monster/${id}`;
}

function showMob(id){
if(!dbLoaded || !mobStats[id]) return;

const s = mobStats[id];
const drops = mobToItems[id] || [];
const maps = mobSpawn[id] || [];

let html = `
<div class="section">
<img class="sprite" src="https://static.divine-pride.net/images/mobs/${id}.gif">

<div class="title">${s.name}
<span class="tag">ID ${id}</span>
</div>

<a class="link" href="${divineMob(id)}" target="_blank">
🔗 View on Divine Pride
</a>

<div class="stats">
Level: ${s.level} <br>
HP: ${s.hp} <br>
ATK: ${s.atk1} ~ ${s.atk2} <br>
DEF: ${s.def} | MDEF: ${s.mdef} <br>
STR: ${s.str} AGI: ${s.agi} VIT: ${s.vit} <br>
INT: ${s.int} DEX: ${s.dex} LUK: ${s.luk} <br>
Race: ${s.race} | Element: ${s.element}
</div>

<div class="stats">
<b>Maps:</b><br>
${maps.length ? maps.join(", ") : "Unknown"}
</div>

<div class="stats">
<b>Drops:</b><br>
${drops.map(d=>`
<div class="mob" onclick="showItem(${d.item_id})">
${d.item_name} (${(d.rate/100).toFixed(2)}%)
</div>
`).join("")}
</div>
</div>
`;

document.getElementById("result").innerHTML = html;
}

function showItem(id){
if(!dbLoaded || !itemInfo[id]) return;

const info = itemInfo[id];
const mobs = itemToMobs[id] || [];

let html = `
<div class="section">
<img class="sprite" src="https://static.divine-pride.net/images/items/${id}.png">

<div class="title">
${info.name}
<span class="tag">ID ${id}</span>
<span class="tag">${info.aegis}</span>
</div>

<a class="link" href="${divineItem(id)}" target="_blank">
🔗 View on Divine Pride
</a>

<div class="stats">
<b>Dropped by:</b><br>
${mobs.map(m=>`
<div class="mob" onclick="showMob(${m.mob_id})">
${m.mob_name} (${(m.rate/100).toFixed(2)}%)
</div>
`).join("")}
</div>
</div>
`;

document.getElementById("result").innerHTML = html;
}

function setupSearch(inputId, autoId, data, callback, isMob){
const input = document.getElementById(inputId);
const auto = document.getElementById(autoId);

input.addEventListener("input", debounce(()=>{

let val = input.value.toLowerCase().trim();
auto.innerHTML="";

if(!val) return;

// busca por ID direto
if(data[val]){
let name = isMob ? data[val].name : data[val];

let div = document.createElement("div");
div.className="autoitem";
div.innerText = `[ID ${val}] ${name}`;
div.onclick = ()=>{
callback(val);
auto.innerHTML="";
input.value="";
};
auto.appendChild(div);
return;
}

// busca por nome
Object.entries(data)
.filter(([id,obj])=>{
let name = isMob ? obj.name : obj;
return name.toLowerCase().includes(val);
})
.slice(0,20)
.forEach(([id,obj])=>{
let name = isMob ? obj.name : obj;

let div = document.createElement("div");
div.className="autoitem";
div.innerText = `[${id}] ${name}`;

div.onclick=()=>{
callback(id);
auto.innerHTML="";
input.value="";
};

auto.appendChild(div);
});

},200));
}
</script>

</body>
</html>
